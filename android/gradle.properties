org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=false
android.nonTransitiveRClass=true

# ===== 部署配置：改成你自己的域名（不含 https://），重新打包即可 =====
# 注意：留着占位符不动的话，构建会直接失败（见 app/build.gradle 里的强校验），
# 目的是避免 clone 下来直接打包、结果连到原作者的服务器上。
siteHost=your-domain.example.com
